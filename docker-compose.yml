x-worker-common: &worker-common
  build: .
  volumes:
    - .:/app
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    RATELIMIT_REDIS_URL: redis://redis:6379/3
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    ports: 
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - 8000:8000
    volumes:
      - .:/app
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  
  worker-example:
    <<: *worker-common
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q scrape_example_com -n worker-example@%h
    
  worker-httpbin:
    <<: *worker-common
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q scrape_httpbin_org -n worker-httpbin@%h
  
  worker-quotes:
    <<: *worker-common
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q scrape_quotes_toscrape_com -n worker-quotes@%h
  
  worker-books:
    <<: *worker-common
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q scrape_books_toscrape_com -n worker-books@%h
  
  worker-default:
    <<: *worker-common
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q celery -n worker-default@%h
  flower:
    build: .
    command: celery -A app.celery_app flower --port=5555
    ports:
      - 5555:5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
      - worker-example
    restart: unless-stopped

volumes:
  redis_data: